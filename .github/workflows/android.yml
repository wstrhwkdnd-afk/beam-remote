name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beam-remote-debug-and-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
